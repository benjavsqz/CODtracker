version: '3.9'

networks:
  coolify:
    external: true

volumes:
  metawz-db:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - metawz-db:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - "coolify.managed=true"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coolify
    labels:
      - "coolify.managed=true"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - coolify
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.metawz-http.entrypoints=http"
      - "traefik.http.routers.metawz-http.rule=Host(`metawz.shifters.cl`)"
      - "traefik.http.routers.metawz-http.middlewares=redirect-to-https"
      - "traefik.http.routers.metawz-https.entrypoints=https"
      - "traefik.http.routers.metawz-https.rule=Host(`metawz.shifters.cl`)"
      - "traefik.http.routers.metawz-https.tls=true"
      - "traefik.http.routers.metawz-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.metawz.loadbalancer.server.port=80"
      - "traefik.http.routers.metawz-https.service=metawz"
