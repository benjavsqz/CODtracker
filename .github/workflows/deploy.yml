name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.121.56.29
          port: 22022
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          script: |
            set -e
            DEPLOY_DIR="/opt/metawz"

            # Clone or update repo
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$DEPLOY_DIR"
              git clone https://github.com/benjavsqz/CODtracker.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            # Copy env vars from running containers if they exist
            RUNNING=$(docker ps --filter name=metawz --format '{{.Names}}' | head -1)
            if [ -n "$RUNNING" ]; then
              docker inspect "$RUNNING" --format '{{range .Config.Env}}{{println .}}{{end}}' \
                | grep -E "^(DB_|JWT_|PORT)" > "$DEPLOY_DIR/.env.prod" 2>/dev/null || true
            fi

            # Rebuild and restart
            cd "$DEPLOY_DIR"
            docker compose -f docker-compose.prod.yml pull --ignore-pull-failures 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up --build -d --remove-orphans

            echo "Deploy completado: $(date)"
            docker ps --filter name=metawz --format 'table {{.Names}}\t{{.Status}}'
