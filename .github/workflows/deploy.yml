name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22022 -H 129.121.56.29 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22022 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='client/dist' \
            ./ root@129.121.56.29:/opt/metawz/

      - name: Build and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key -p 22022 -o StrictHostKeyChecking=no root@129.121.56.29 << 'ENDSSH'
            set -e
            cd /opt/metawz

            # Copy env from running containers if .env doesn't exist
            if [ ! -f .env ]; then
              RUNNING=$(docker ps --filter name=metawz-server --format '{{.Names}}' | head -1)
              if [ -n "$RUNNING" ]; then
                docker inspect "$RUNNING" --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  | grep -E "^(DB_|JWT_|PORT)" > .env 2>/dev/null || true
              fi
            fi

            docker compose -f docker-compose.prod.yml up --build -d --remove-orphans
            echo "=== Deploy completado: $(date) ==="
            docker ps --filter name=metawz --format 'table {{.Names}}\t{{.Status}}'
          ENDSSH
